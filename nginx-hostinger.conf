## 📌 Configurações Alternativas

### Se Usar Subdomain

```nginx
server {
    server_name api.seu-dominio.com.br;
    # ... resto da configuração igual acima
}
```

### Se Usar Path `/api`

```nginx
location /api {
    proxy_pass http://localhost:3000;
    # ... resto da configuração igual
}
```

### Para Multi-Port (múltiplas aplicações)

```nginx
# Aplicação principal na porta 3000
location / {
    proxy_pass http://localhost:3000;
}

# API em porta diferente
location /api-v2 {
    proxy_pass http://localhost:3001;
}
```

