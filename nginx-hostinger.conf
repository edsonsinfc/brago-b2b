## 🔍 Verificação e Debug

### Testar Configuração
```bash
# Verificar sintaxe
sudo nginx -t

# Recarregar nginx
sudo systemctl reload nginx

# Verificar se está rodando
sudo systemctl status nginx

# Ver logs de erro
tail -f /var/log/nginx/seu-dominio.error.log

# Ver logs de acesso
tail -f /var/log/nginx/seu-dominio.access.log
```

### Verificar Conectividade
```bash
# Testar localhost
curl http://localhost:3000/health

# Testar através do nginx
curl http://seu-dominio.com.br/health

# Com HTTPS
curl https://seu-dominio.com.br/health
```

