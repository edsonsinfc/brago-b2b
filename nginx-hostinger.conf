# Configuração Nginx para Hostinger

Este arquivo contém as configurações recomendadas do Nginx para rodar a aplicação Node.js no Hostinger.

## 📋 Localização do Arquivo

No servidor Hostinger, criar arquivo em:
```
/etc/nginx/sites-available/seu-dominio.com.br
```

## 🔗 Como Usar

1. **Criar arquivo:**
```bash
sudo nano /etc/nginx/sites-available/seu-dominio.com.br
```

2. **Copiar conteúdo abaixo e substituir `seu-dominio.com.br` pelos dados reais**

3. **Ativar site:**
```bash
sudo ln -s /etc/nginx/sites-available/seu-dominio.com.br /etc/nginx/sites-enabled/
```

4. **Testar configuração:**
```bash
sudo nginx -t
```

5. **Recarregar Nginx:**
```bash
sudo systemctl reload nginx
```

