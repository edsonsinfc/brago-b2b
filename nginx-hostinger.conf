## 📊 Monitoramento

### Verificar Status
```bash
# Estatísticas de requisições
nginx_status

# Processos nginx
ps aux | grep nginx

# Portas ativas
netstat -tlnp | grep nginx
```

### Logs Úteis
```bash
# Ultimas 50 linhas de erro
tail -n 50 /var/log/nginx/seu-dominio.error.log

# Requisições de erro
tail -f /var/log/nginx/seu-dominio.access.log | grep " 5[0-9][0-9] "

# Requisições lentas (> 1s)
tail -f /var/log/nginx/seu-dominio.access.log | grep -oE '\([0-9]{4,}ms\)'
```

