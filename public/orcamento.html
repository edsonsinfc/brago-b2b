<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Orçamento - B2B Brago Distribuidora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
      --white: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,0.12);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-left h1 {
      font-size: 1.75rem;
      color: var(--gray-900);
      margin-bottom: 0.25rem;
    }

    .header-left p {
      font-size: 0.875rem;
      color: var(--gray-500);
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #16a34a;
    }

    .btn-secondary {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    .btn-secondary:hover {
      background: var(--gray-300);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 0.5rem;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state i {
      font-size: 4rem;
      color: var(--gray-300);
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      color: var(--gray-700);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--gray-500);
      margin-bottom: 1.5rem;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item {
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      gap: 1rem;
      align-items: start;
      transition: all 0.2s;
    }

    .item:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }

    .item-info {
      flex: 1;
    }

    .item-code {
      font-size: 0.75rem;
      color: var(--gray-500);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 0.75rem;
    }

    .item-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      padding: 0.25rem;
    }

    .quantity-control button {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--gray-100);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .quantity-control button:hover {
      background: var(--gray-200);
    }

    .quantity-control input {
      width: 60px;
      text-align: center;
      border: none;
      font-weight: 600;
      color: var(--gray-900);
    }

    .obs-input {
      flex: 1;
      min-width: 200px;
      padding: 0.5rem 0.75rem;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 0.875rem;
    }

    .obs-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .item-actions {
      display: flex;
      align-items: center;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid var(--gray-200);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .total-items {
      font-size: 1.125rem;
      color: var(--gray-700);
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .item {
        flex-direction: column;
      }

      .footer-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .action-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>🛒 Meu Orçamento</h1>
        <p id="userGreeting">Carregando...</p>
      </div>
      <div>
        <a href="/galeria.html" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i>
          Voltar para Galeria
        </a>
      </div>
    </div>

    <!-- Carrinho -->
    <div class="card">
      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-clipboard-list"></i>
        <h3>Seu orçamento está vazio</h3>
        <p>Adicione produtos da galeria para solicitar um orçamento</p>
        <a href="/galeria.html" class="btn btn-primary">
          <i class="fas fa-plus"></i>
          Adicionar Produtos
        </a>
      </div>

      <!-- Lista de Itens -->
      <div id="itemList" class="item-list"></div>

      <!-- Footer Actions -->
      <div id="footerActions" class="footer-actions" style="display: none;">
        <div class="total-items">
          <i class="fas fa-box"></i>
          Total: <span id="totalItems">0</span> item(ns)
        </div>
        <div class="action-buttons">
          <button class="btn btn-secondary" onclick="limparCarrinho()">
            <i class="fas fa-trash"></i>
            Limpar Orçamento
          </button>
          <button class="btn btn-success" onclick="enviarOrcamento()">
            <i class="fas fa-paper-plane"></i>
            Enviar para Vendedor
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/orcamento.js"></script>
</body>
</html>
