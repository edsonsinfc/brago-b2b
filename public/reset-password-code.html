<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - B2B Brago Distribuidora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --orange: #ff6600;
      --dark-blue: #003d82;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #003d82 0%, #005eb8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 2.5rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo img {
      max-width: 200px;
      height: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header i {
      font-size: 3rem;
      color: var(--orange);
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.75rem;
      color: var(--dark-blue);
      margin-bottom: 0.5rem;
    }

    .header p {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark-blue);
      font-size: 0.9rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      padding-left: 3rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
      color: #333;
      background-color: white;
    }

    input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      color: #9ca3af;
      font-size: 1.1rem;
    }

    .code-input {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 0.5rem;
      font-weight: bold;
      padding-left: 1rem !important;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #e65c00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.9rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert i {
      font-size: 1.25rem;
    }

    .back-to-login {
      text-align: center;
      margin-top: 1.5rem;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .back-to-login a {
      color: var(--orange);
      text-decoration: none;
      font-weight: 600;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .password-requirements {
      background: #f9fafb;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .password-requirements p {
      margin-bottom: 0.5rem;
      color: #374151;
      font-weight: 600;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #6b7280;
      margin-bottom: 0.25rem;
    }

    .requirement i {
      font-size: 0.75rem;
    }

    .requirement-met {
      color: var(--success);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/images/Group 21.png" alt="BRAGO B2B Distribuidora">
    </div>

    <div class="header">
      <i class="fas fa-key"></i>
      <h1>Redefinir Senha</h1>
      <p id="emailInfo">Digite o código enviado para seu email</p>
    </div>

    <div id="alertContainer"></div>

    <form id="formReset">
      <div class="form-group">
        <label for="codigo">Código de Recuperação</label>
        <div class="input-wrapper">
          <i class="fas fa-shield-alt"></i>
          <input 
            type="text" 
            id="codigo" 
            class="code-input"
            placeholder="000000" 
            required 
            maxlength="6"
            pattern="\d{6}"
            autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label for="novaSenha">Nova Senha</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="novaSenha" 
            placeholder="Digite sua nova senha" 
            required
            autocomplete="new-password">
        </div>
        <div class="password-requirements">
          <p>Requisitos da senha:</p>
          <div class="requirement" id="req-length">
            <i class="fas fa-circle"></i>
            <span>Mínimo de 8 caracteres</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Nova Senha</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="confirmarSenha" 
            placeholder="Digite novamente" 
            required
            autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btnRedefinir">
        <i class="fas fa-check"></i>
        Redefinir Senha
      </button>

      <button type="button" class="btn btn-secondary" onclick="window.location.href='/forgot-password.html'">
        <i class="fas fa-arrow-left"></i>
        Reenviar Código
      </button>
    </form>

    <div class="back-to-login">
      Lembrou sua senha? <a href="/login.html">Fazer login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('formReset');
    const codigoInput = document.getElementById('codigo');
    const novaSenhaInput = document.getElementById('novaSenha');
    const confirmarSenhaInput = document.getElementById('confirmarSenha');
    const btnRedefinir = document.getElementById('btnRedefinir');
    const alertContainer = document.getElementById('alertContainer');
    const emailInfo = document.getElementById('emailInfo');

    // Recuperar email do localStorage
    const email = localStorage.getItem('recovery_email');
    if (!email) {
      window.location.href = '/forgot-password.html';
    } else {
      emailInfo.textContent = `Digite o código enviado para ${email}`;
    }

    function showAlert(message, type = 'info') {
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
      };

      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <i class="fas ${icons[type]}"></i>
          <div>${message}</div>
        </div>
      `;
    }

    // Validar senha em tempo real
    novaSenhaInput.addEventListener('input', function() {
      const senha = this.value;
      const reqLength = document.getElementById('req-length');
      
      if (senha.length >= 8) {
        reqLength.classList.add('requirement-met');
      } else {
        reqLength.classList.remove('requirement-met');
      }
    });

    // Permitir apenas números no código
    codigoInput.addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '');
    });

    // Submit form
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const codigo = codigoInput.value;
      const novaSenha = novaSenhaInput.value;
      const confirmarSenha = confirmarSenhaInput.value;
      
      if (codigo.length !== 6) {
        showAlert('O código deve ter 6 dígitos.', 'error');
        return;
      }
      
      if (novaSenha.length < 8) {
        showAlert('A senha deve ter no mínimo 8 caracteres.', 'error');
        return;
      }
      
      if (novaSenha !== confirmarSenha) {
        showAlert('As senhas não coincidem.', 'error');
        return;
      }

      btnRedefinir.disabled = true;
      btnRedefinir.innerHTML = '<i class="fas fa-spinner spinner"></i> Redefinindo...';
      alertContainer.innerHTML = '';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, codigo, novaSenha })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(
            `<strong>Senha redefinida com sucesso!</strong><br>
            Redirecionando para a página de login...`,
            'success'
          );
          
          // Limpar email do localStorage
          localStorage.removeItem('recovery_email');
          
          // Redirecionar após 3 segundos
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } else {
          showAlert(data.error || 'Erro ao redefinir senha', 'error');
          btnRedefinir.disabled = false;
          btnRedefinir.innerHTML = '<i class="fas fa-check"></i> Redefinir Senha';
        }
      } catch (error) {
        console.error('Erro:', error);
        showAlert('Erro ao conectar com o servidor. Tente novamente.', 'error');
        btnRedefinir.disabled = false;
        btnRedefinir.innerHTML = '<i class="fas fa-check"></i> Redefinir Senha';
      }
    });
  </script>
</body>
</html>
