<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci Minha Senha - B2B Brago Distribuidora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo img {
      max-width: 220px;
      height: auto;
      margin-bottom: 0.5rem;
    }

    .logo h1 {
      font-size: 1.5rem;
      color: var(--gray-900);
      margin-bottom: 0.25rem;
    }

    .logo p {
      color: var(--gray-500);
      font-size: 0.875rem;
    }

    .icon-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .icon-header i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .icon-header h2 {
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .icon-header p {
      color: var(--gray-600);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: var(--gray-700);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
    }

    input[type="email"] {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--gray-200);
      color: var(--gray-700);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: var(--gray-300);
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .alert i {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert-info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    .back-to-login {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--gray-600);
    }

    .back-to-login a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/images/Group 23.svg" alt="BRAGO">
      <h1>B2B Brago Distribuidora</h1>
      <p>Sistema de Gestão Comercial</p>
    </div>

    <div class="icon-header">
      <i class="fas fa-key"></i>
      <h2>Esqueci Minha Senha</h2>
      <p>Digite seu e-mail para receber instruções de recuperação</p>
    </div>

    <div id="alertContainer"></div>

    <form id="formRecuperacao">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btnEnviar">
        <i class="fas fa-paper-plane"></i>
        Enviar Código de Recuperação
      </button>

      <button type="button" class="btn btn-secondary" onclick="window.location.href='/login.html'">
        <i class="fas fa-arrow-left"></i>
        Voltar ao Login
      </button>
    </form>

    <div class="back-to-login">
      Lembrou sua senha? <a href="/login.html">Fazer login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('formRecuperacao');
    const emailInput = document.getElementById('email');
    const btnEnviar = document.getElementById('btnEnviar');
    const alertContainer = document.getElementById('alertContainer');

    function showAlert(message, type = 'info') {
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        info: 'fa-info-circle'
      };

      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <i class="fas ${icons[type]}"></i>
          <div>${message}</div>
        </div>
      `;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      
      if (!email) {
        showAlert('Por favor, digite seu e-mail.', 'error');
        return;
      }

      // Desabilitar botão e mostrar loading
      btnEnviar.disabled = true;
      btnEnviar.innerHTML = '<i class="fas fa-spinner spinner"></i> Enviando...';
      alertContainer.innerHTML = '';

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(
            `<strong>Código enviado!</strong><br>
            Um código de 6 dígitos foi enviado para <strong>${email}</strong>.<br>
            Verifique sua caixa de entrada e também a pasta de spam.`,
            'success'
          );
          
          // Salvar email no localStorage para próxima tela
          localStorage.setItem('recovery_email', email);
          
          // Redirecionar para tela de código após 2 segundos
          setTimeout(() => {
            window.location.href = '/reset-password-code.html';
          }, 2000);
        } else {
          showAlert(data.error || 'Erro ao processar solicitação', 'error');
        }
      } catch (error) {
        console.error('Erro:', error);
        showAlert('Erro ao conectar com o servidor. Tente novamente.', 'error');
      } finally {
        // Reabilitar botão
        btnEnviar.disabled = false;
        btnEnviar.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Código de Recuperação';
      }
    });
  </script>
</body>
</html>
