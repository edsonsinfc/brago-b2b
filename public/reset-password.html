<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - B2B Brago Distribuidora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo img {
      max-width: 220px;
      height: auto;
      margin-bottom: 0.5rem;
    }

    .icon-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .icon-header i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .icon-header h2 {
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .user-info {
      background: var(--gray-100);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .user-info p {
      color: var(--gray-600);
      margin-bottom: 0.25rem;
    }

    .user-info strong {
      color: var(--gray-900);
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: var(--gray-700);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
      cursor: pointer;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 3rem 0.75rem 2.75rem;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .password-requirements {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-top: 0.5rem;
    }

    .password-requirements ul {
      margin-top: 0.5rem;
      padding-left: 1.5rem;
    }

    .password-requirements li {
      margin-bottom: 0.25rem;
    }

    .requirement-met {
      color: var(--success);
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .alert i {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert-warning {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loadingScreen {
      text-align: center;
      padding: 2rem;
    }

    #loadingScreen i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/images/Group 23.svg" alt="BRAGO">
    </div>

    <div id="loadingScreen">
      <i class="fas fa-spinner spinner"></i>
      <p>Validando token...</p>
    </div>

    <div id="mainContent" style="display: none;">
      <div class="icon-header">
        <i class="fas fa-lock"></i>
        <h2>Redefinir Senha</h2>
      </div>

      <div class="user-info">
        <p>Redefinindo senha para:</p>
        <strong id="userName"></strong><br>
        <small id="userEmail"></small>
      </div>

      <div id="alertContainer"></div>

      <form id="formResetSenha">
        <div class="form-group">
          <label for="novaSenha">Nova Senha</label>
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required>
            <i class="fas fa-eye toggle-password" id="toggleNovaSenha"></i>
          </div>
          <div class="password-requirements">
            <ul>
              <li id="req-length">Mínimo 6 caracteres</li>
            </ul>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar Nova Senha</label>
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmarSenha" placeholder="Confirme sua nova senha" required>
            <i class="fas fa-eye toggle-password" id="toggleConfirmarSenha"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnRedefinir">
          <i class="fas fa-check"></i>
          Redefinir Senha
        </button>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    const loadingScreen = document.getElementById('loadingScreen');
    const mainContent = document.getElementById('mainContent');
    const alertContainer = document.getElementById('alertContainer');
    const form = document.getElementById('formResetSenha');
    const novaSenhaInput = document.getElementById('novaSenha');
    const confirmarSenhaInput = document.getElementById('confirmarSenha');
    const btnRedefinir = document.getElementById('btnRedefinir');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');

    function showAlert(message, type = 'error') {
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle'
      };

      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <i class="fas ${icons[type]}"></i>
          <div>${message}</div>
        </div>
      `;
    }

    // Validar token ao carregar
    async function validateToken() {
      if (!token) {
        showAlert('Token não fornecido. Link inválido.', 'error');
        setTimeout(() => window.location.href = '/forgot-password.html', 3000);
        return;
      }

      try {
        const response = await fetch(`/api/password/validate-token/${token}`);
        const data = await response.json();

        if (response.ok && data.valid) {
          userName.textContent = data.nome;
          userEmail.textContent = data.email;
          loadingScreen.style.display = 'none';
          mainContent.style.display = 'block';
        } else {
          loadingScreen.innerHTML = `
            <i class="fas fa-times-circle" style="color: var(--danger);"></i>
            <h3>Token Inválido ou Expirado</h3>
            <p style="color: var(--gray-600); margin-top: 1rem;">
              O link de recuperação expirou ou já foi utilizado.
            </p>
            <p style="margin-top: 1rem;">
              <a href="/forgot-password.html" style="color: var(--primary);">
                Solicitar novo link de recuperação
              </a>
            </p>
          `;
        }
      } catch (error) {
        console.error('Erro:', error);
        showAlert('Erro ao validar token. Tente novamente.', 'error');
      }
    }

    // Toggle password visibility
    document.getElementById('toggleNovaSenha').addEventListener('click', function() {
      const type = novaSenhaInput.type === 'password' ? 'text' : 'password';
      novaSenhaInput.type = type;
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    document.getElementById('toggleConfirmarSenha').addEventListener('click', function() {
      const type = confirmarSenhaInput.type === 'password' ? 'text' : 'password';
      confirmarSenhaInput.type = type;
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    // Validar senha em tempo real
    novaSenhaInput.addEventListener('input', function() {
      const senha = this.value;
      const reqLength = document.getElementById('req-length');
      
      if (senha.length >= 6) {
        reqLength.classList.add('requirement-met');
      } else {
        reqLength.classList.remove('requirement-met');
      }
    });

    // Submit form
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const novaSenha = novaSenhaInput.value;
      const confirmarSenha = confirmarSenhaInput.value;
      
      if (novaSenha.length < 6) {
        showAlert('A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }
      
      if (novaSenha !== confirmarSenha) {
        showAlert('As senhas não coincidem.', 'error');
        return;
      }

      btnRedefinir.disabled = true;
      btnRedefinir.innerHTML = '<i class="fas fa-spinner spinner"></i> Redefinindo...';
      alertContainer.innerHTML = '';

      try {
        const response = await fetch('/api/password/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token, novaSenha })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(
            `<strong>Senha redefinida com sucesso!</strong><br>
            Redirecionando para a página de login...`,
            'success'
          );
          
          // Redirecionar após 3 segundos
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } else {
          showAlert(data.error || 'Erro ao redefinir senha', 'error');
          btnRedefinir.disabled = false;
          btnRedefinir.innerHTML = '<i class="fas fa-check"></i> Redefinir Senha';
        }
      } catch (error) {
        console.error('Erro:', error);
        showAlert('Erro ao conectar com o servidor. Tente novamente.', 'error');
        btnRedefinir.disabled = false;
        btnRedefinir.innerHTML = '<i class="fas fa-check"></i> Redefinir Senha';
      }
    });

    // Validar token ao carregar página
    validateToken();
  </script>
</body>
</html>
